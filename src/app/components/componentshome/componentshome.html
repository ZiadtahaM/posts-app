<div class="page-container">

  <div class="form-card">
    <h2>Create or Edit a Post</h2>
    
    <form (ngSubmit)="saveposts()">
      <div class="form-group">
        <label for="posttitle">Post Title</label>
        <input type="text" id="posttitle" name="posttitle" [(ngModel)]="posttitle" placeholder="Enter a catchy title" required>
      </div>
      
      <div class="form-group">
        <label for="postbody">Post Body</label>
        <textarea id="postbody" name="postbody" [(ngModel)]="postbody" placeholder="Write your content here..." required rows="5"></textarea>
      </div>
      
      <input type="hidden" id="postid" name="postid" [(ngModel)]="postid">
      
      <div class="button-group">
        <button type="submit" class="btn btn-primary">Save Post</button>
        <button type="button" (click)="deletpost(posts.id)" class="btn btn-danger">Delete Post</button>
      </div>
    </form>
  </div>

  <hr class="divider">

  <div class="posts-section">
    <h2>Your Creative Posts</h2>
    <div class="post-list">
      @for (post of posts; track post.id) {
        <div class="post-card">
          <div class="post-card-header">
            <span class="post-id">#{{ post.id }}</span>
            <h3>{{ post.title }}</h3>
          </div>
          <p class="post-card-body">{{ post.body }}</p>
          <div class="post-card-actions">
            <a [routerLink]="['/singlepost', post.id]" class="btn btn-secondary">View</a>
            <a [routerLink]="['/edit', post.id]" class="btn btn-tertiary">Edit</a>
  <button type="button" (click)="deletpost(post.id)" class="btn btn-danger">Delete Post</button>
          </div>
        </div>
      } @empty {
        <p class="empty-message">No posts found. Let your creativity flow!</p>
      }
    </div>
  </div>

</div>
